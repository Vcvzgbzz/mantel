name: image

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          push: true
          # One manifest per build: an attestation index would add untagged versions per push.
          provenance: false
          tags: |
            ghcr.io/vcvzgbzz/mantel:${{ github.sha }}
            ghcr.io/vcvzgbzz/mantel:${{ github.ref_type == 'tag' && github.ref_name || 'main' }}
